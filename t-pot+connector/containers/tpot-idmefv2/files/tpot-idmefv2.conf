[logging]
# Logging level: change to DEBUG for more information, INFO for less information
level = DEBUG

[idmefv2]
# URL of server to POST IDMEFv2 alerts (testserver inside Docker network)
url = http://testserver.idmefv2:9999

[tpot]
# Elasticsearch URL (inside Docker network, using service name)
elasticsearch_url = http://elasticsearch:9200
# Polling interval in seconds (shorter for testing)
poll_interval = 10
# Elasticsearch index pattern for T-Pot events
index_pattern = logstash-*
# Process existing events on startup
catch_up = true
