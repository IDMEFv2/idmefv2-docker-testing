name: "sshd auth failure"

index: filebeat-*

type: any

filter:
  - query:
      query_string:
        query: "system.auth.ssh.event:Invalid"

alert: "idmefv2.connectors.elastalert2.IDMEFv2Alerter"
idmefv2_url: http://testserver.idmefv2:9999
idmefv2_template:  |-
  {
    "Version": "2.D.V04",
    "ID": "{{ match.agent.id }}",
    "CreateTime": "{{ match['@timestamp'] }}",
    "Category": ["Malicious.System"],
    "Description": "{{ rule.name }}",
    "Analyzer": {
      "Name": "{{ match.agent.type }}",
      "IP": "{{ match.source.ip }}"
    }
  }
